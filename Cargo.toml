[package]
name = "rust-service"
version = "0.1.0"
edition = "2024"
description = "Container- and Kubernetes-ready Rust service template"
license = "MIT"
publish = false

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["trace", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

# Optimized for a small, fast container image rather than compile time.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
